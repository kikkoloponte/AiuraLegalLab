  - id: sequestro_preventivo_confisca_equivalente_penale
    label: "Sequestro preventivo e confisca per equivalente (penale)"
    settore: penale
    norme_urn:
      - "urn:nir:stato:decreto.del.presidente.della.repubblica:1988-09-22;447~art321"  # art. 321 c.p.p.
      - "urn:nir:stato:regio.decreto:1930-10-19;1398~art383"                            # art. 322-ter c.p. (URN storico)
      - "urn:nir:stato:regio.decreto:1930-10-19;1398~art240"                            # art. 240 c.p.
    norme_riferimento:
      - "art. 321 c.p.p. (sequestro preventivo)"
      - "art. 322-ter c.p. (confisca per equivalente)"
      - "art. 240 c.p. (confisca)"
    termini_chiave:
      - "sequestro preventivo"
      - "confisca per equivalente"
      - "profitto del reato"
      - "sequestro finalizzato alla confisca"
    disambigua_da:
      confisca_antimafia_equivalente:
        - "art. 321 c.p.p."
        - "profitto del reato"
        - "reato tributario"
        - "procedimento penale"
    sentenze_pilota:
      - organo: "Cass. SS.UU. penali"
        numero: "10561"
        anno: "2014"
        nome: "Gubert"
        principio: >-
          Verso il terzo estraneo al reato il sequestro per equivalente non è
          ammesso: è consentita solo la confisca diretta del profitto del reato
          che si trovi nella sua disponibilità. Il per-equivalente colpisce i
          soli beni del reo, e quando il sequestro diretto del profitto è
          impossibile ex actis.
        source_id: "aiura_upload_j4o38mif"

