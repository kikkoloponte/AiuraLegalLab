services:
  neo4j:
    image: neo4j:5-community
    container_name: aiura-neo4j-poc
    restart: unless-stopped
    ports:
      - "7474:7474"  # Browser HTTP (UI di ispezione del grafo)
      - "7687:7687"  # Bolt (driver Python)
    environment:
      NEO4J_AUTH: "neo4j/aiura-poc-pw"
      # Limiti di memoria conservativi — punto di partenza per Fase A,
      # da rimisurare sul grafo reale (307k nodi / 666k archi) prima di
      # alzarli. Vedi piano migrazione: misurare RAM a riposo e sotto query.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      # Disabilita telemetria e plugin non necessari per il POC
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  neo4j_data:
  neo4j_logs:
