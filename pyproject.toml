[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiura-legal"
version = "0.1.0.dev0"
description = "AiUra LegalLab — AI Legale con MongoDB"
requires-python = ">=3.11"
dependencies = [
    # MongoDB — pymongo (sync, allineato a LegalAgentLab) + motor (async per FastAPI)
    "pymongo>=4.7.0",
    "motor>=3.4.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    # NLP
    "spacy>=3.7.0",
    # LLM
    "ollama>=0.3.0",
    "httpx>=0.27.0",
    # Parsing documenti
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.3.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tiktoken>=0.7.0",
    "rapidfuzz>=3.9.0",
    "python-slugify>=8.0.0",
    "networkx>=3.3",
    "aiofiles>=23.2.1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "mongomock-motor>=0.0.21",
]

[tool.setuptools.packages.find]
include = ["aiura_legal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: test che richiedono indici su disco (workspaces/)",
    "slow: test lenti (>5s) — escludi con -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"